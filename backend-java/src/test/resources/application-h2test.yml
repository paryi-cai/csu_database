# 仅用于本地接口契约回归测试（mvn test），生产运行不加载本文件。
# 使用 H2 的 MySQL 兼容模式，使开发机没有 MySQL / Docker 时也能验证接口。
# H2 依赖为 test scope，不会进入可执行 jar。
spring:
  datasource:
    druid:
      driver-class-name: org.h2.Driver
      # 库名带随机后缀：@DirtiesContext 会让 Spring 重建上下文并重跑 schema/data 脚本，
      # 若库名固定（DB_CLOSE_DELAY=-1 使内存库在 JVM 内长期存活），重跑必然撞主键、
      # 表现为"上下文重建后数据没复位"。改成每个上下文一个新库，初始化即可干净重放。
      url: jdbc:h2:mem:csu_takeout_test_${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
      initial-size: 1
      min-idle: 1
      max-active: 4
  sql:
    init:
      mode: always
      schema-locations: classpath:testdb/schema.sql
      data-locations: classpath:testdb/data.sql
      # 触发器等对象体内部含有分号，Spring 默认按分号切分语句会把它们截断；
      # 因此这两个测试脚本统一使用 @@ 作为语句分隔符。
      separator: "@@"
  cache:
    # 测试不连 Redis：用内存缓存（spring-context 自带 ConcurrentMapCacheManager），
    # @Cacheable/@CacheEvict 仍会被真实执行，从而覆盖缓存注解与 key 拼接逻辑
    type: simple

# 测试环境不依赖 Redis（RedisAutoConfiguration 的连接是惰性的，不会被触发）
csu:
  jwt:
    secret-key: 12asdffa2323
    ttl: 86400000
    token-name: token
    issuer: wufang
  alert:
    # 测试环境不发送真实邮件：未启用时 alertNow/alert 都只写日志，便于断言业务失败响应
    enabled: false
  consistency:
    # 巡检改为两个固定的 H2 内存库（由 ManagerAlertApiTest 自行建表/清表），
    # 从而不依赖 Docker / MySQL / MariaDB / PostgreSQL，结果完全确定
    source:
      name: H2Source
      url: jdbc:h2:mem:consistency_src;DB_CLOSE_DELAY=-1
      username: sa
      password: ""
    targets:
      - name: H2Target
        url: jdbc:h2:mem:consistency_tgt;DB_CLOSE_DELAY=-1
        username: sa
        password: ""
    tables: [probe]

logging:
  level:
    com.csu.takeout: info
