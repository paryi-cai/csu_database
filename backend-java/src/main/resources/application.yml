server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: csu-takeout
  profiles:
    # 默认允许叠加 local（可选）：真实密钥/私有连接信息放 application-local.yml（已被 .gitignore 忽略）。
    # 用 docker compose 启动时无需该文件，连接信息全部由环境变量注入，环境变量优先级更高。
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 默认值对齐 docker-compose 的端口映射（MySQL: 3307, Redis: 6379），
      # 因此本地直接 `mvn spring-boot:run` 也能连上容器里的数据库；容器内由环境变量覆盖。
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:caimingxuan}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=false
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 启动时不因数据库暂时不可用而中断（由 docker-compose 的 depends_on / healthcheck 保证顺序）
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
  mail:
    # SMTP：用于异常检测与告警邮件。默认留空 = 不启用；设置 MAIL_HOST 等环境变量后生效。
    # 常见配置（QQ 邮箱）：MAIL_HOST=smtp.qq.com、MAIL_PORT=465、MAIL_USERNAME=xxx@qq.com、
    # MAIL_PASSWORD=SMTP 授权码；随后把 ALERT_ENABLED 设为 true、ALERT_TO 设为收件人。
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.ssl.enable: ${MAIL_SMTP_SSL:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.csu.takeout.entity
  configuration:
    # 本项目响应键名与数据库列名并非简单驼峰对应（order_money -> price、m_sale_v -> sale、
    # dispatcher_phone -> disp_phone），因此关闭驼峰映射，一律在 SQL 中用 AS 显式指定别名。
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true

# 接口文档（Knife4j 4.x / OpenAPI 3）：http://localhost:5000/doc.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com:
      csu:
        takeout:
          mapper: debug
          service: info
          controller: info

csu:
  jwt:
    # JWT 签名密钥（默认值；生产请用环境变量 JWT_SECRET 覆盖）
    secret-key: ${JWT_SECRET:12asdffa2323}
    # 过期时间：24 小时（86400000 毫秒）
    ttl: 86400000
    # 前端在自定义请求头 token 中传递 JWT（不是 Authorization: Bearer）
    token-name: token
    # 签发者，解析时强校验
    issuer: wufang
  alert:
    # 异常告警（默认关闭）：开启前请先配置 spring.mail.* / MAIL_* 环境变量
    enabled: ${ALERT_ENABLED:false}
    # 发件人；留空时取 MAIL_USERNAME
    from: ${ALERT_FROM:}
    # 收件人，逗号分隔多个
    to: ${ALERT_TO:}
    # 同一告警键的抑制窗口（分钟），防止异常风暴把邮箱打爆
    throttle-minutes: ${ALERT_THROTTLE_MINUTES:10}
    # 邮件主题前缀
    subject-prefix: "[校园快餐系统]"
  consistency:
    # 数据一致性定时巡检（默认关闭）：目标库只在跨库迁移演示时启动，
    # 手动巡检接口 POST /api/manager/alert/patrol 不受该开关限制。
    enabled: ${CONSISTENCY_ENABLED:false}
    # 巡检间隔（毫秒）与首次执行延迟
    interval-ms: ${CONSISTENCY_INTERVAL_MS:300000}
    initial-delay-ms: ${CONSISTENCY_INITIAL_DELAY_MS:60000}
    # 源库（业务 MySQL，连接参数与数据源保持一致）
    source:
      name: MySQL(源库)
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:caimingxuan}?connectTimeout=3000&socketTimeout=5000&useSSL=false
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
    # 目标库（DataX 迁移结果）；容器部署时用 MARIADB_HOST / POSTGRES_HOST 指向宿主机
    targets:
      - name: MariaDB
        url: jdbc:mysql://${MARIADB_HOST:localhost}:${MARIADB_PORT:3308}/testdb?connectTimeout=3000&socketTimeout=5000&useSSL=false
        username: ${MARIADB_USER:root}
        password: ${MARIADB_PASSWORD:123456}
      - name: PostgreSQL
        url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/testdb?connectTimeout=3&socketTimeout=5&sslmode=disable
        username: ${POSTGRES_USER:admin}
        password: ${POSTGRES_PASSWORD:123456}
    # 参与比对的表（与 DataX 任务覆盖的 8 张表一致）
    tables:
      - user
      - user_msg
      - fastfood_shop
      - oorder
      - orderway
      - server
      - dispatcher
      - wuliu
