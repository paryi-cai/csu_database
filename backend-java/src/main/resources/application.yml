server:
  port: ${SERVER_PORT:5000}

spring:
  application:
    name: csu-takeout
  profiles:
    # 默认允许叠加 local（可选）：真实密钥/私有连接信息放 application-local.yml（已被 .gitignore 忽略）。
    # 用 docker compose 启动时无需该文件，连接信息全部由环境变量注入，环境变量优先级更高。
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    druid:
      driver-class-name: com.mysql.cj.jdbc.Driver
      # 默认值对齐 docker-compose 的端口映射（MySQL: 3307, Redis: 6379），
      # 因此本地直接 `mvn spring-boot:run` 也能连上容器里的数据库；容器内由环境变量覆盖。
      url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:caimingxuan}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&allowMultiQueries=false
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      # 启动时不因数据库暂时不可用而中断（由 docker-compose 的 depends_on / healthcheck 保证顺序）
      break-after-acquire-failure: false
      connection-error-retry-attempts: 3
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.csu.takeout.entity
  configuration:
    # 本项目响应键名与数据库列名并非简单驼峰对应（order_money -> price、m_sale_v -> sale、
    # dispatcher_phone -> disp_phone），因此关闭驼峰映射，一律在 SQL 中用 AS 显式指定别名。
    map-underscore-to-camel-case: false
    call-setters-on-nulls: true

# 接口文档（Knife4j 4.x / OpenAPI 3）：http://localhost:5000/doc.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com:
      csu:
        takeout:
          mapper: debug
          service: info
          controller: info

csu:
  jwt:
    # JWT 签名密钥与 既有接口默认值保持一致（生产请用环境变量 JWT_SECRET 覆盖）
    secret-key: ${JWT_SECRET:12asdffa2323}
    # 过期时间：24 小时（与既有契约 的 days=1 一致）
    ttl: 86400000
    # 前端在自定义请求头 token 中传递 JWT（不是 Authorization: Bearer）
    token-name: token
    # 签发者，解析时强校验（解析时强校验）
    issuer: wufang
